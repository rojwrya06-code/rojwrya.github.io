
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Roj Wrya</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #080812;
            color: #f5f7ff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .error-container {
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-size: clamp(100px, 25vw, 200px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -10px;
            color: #A855F7;
            text-shadow: 0 0 35px rgba(168, 85, 247, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            margin: 24px 0 12px;
            font-size: clamp(24px, 5vw, 36px);
        }

        p {
            color: #aaa6bd;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;
            padding: 14px 25px;
            border: 1px solid #A855F7;
            border-radius: 10px;
            background: #A855F7;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s ease;
        }

            .home-button:hover {
                background: transparent;
                box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
                transform: translateY(-3px);
            }

        .background-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.13);
            filter: blur(100px);
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="background-glow"></div>

    <main class="error-container">
        <div class="error-code">404</div>
        <h1>Lost in the <span style="color: #A855F7;">digital universe?</span></h1>
        <p>The page you're looking for doesn't exist or may have moved.</p>
        <a class="home-button" href="index.html">← Back to Home</a>
    </main>
</body>
</html>
